name = "clmone-r2-daily-document-backup"
main = "src/index.js"
# Kept at the newest date supported by the pinned local Wrangler runtime.
compatibility_date = "2026-08-08"
workers_dev = false

[triggers]
crons = ["15 2 * * *"]

[[r2_buckets]]
binding = "PRIMARY_DOCUMENTS"
bucket_name = "clmone-documents"
jurisdiction = "eu"

[[r2_buckets]]
binding = "BACKUP_DOCUMENTS"
bucket_name = "clmone-documents-backup"
jurisdiction = "eu"
